<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MACROBAY dashboard live-update check</title>
  <style>
    body { margin: 0; padding: 24px; color: #f2f5ff; background: #101624; font: 14px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    #results { padding: 16px; white-space: pre-wrap; border: 1px solid #34415e; border-radius: 12px; background: #182238; }
    iframe { position: fixed; top: 0; left: -2000px; width: 1366px; height: 900px; border: 0; }
  </style>
<script>window.MACROBAY_TEST_MODE = true;</script>
</head>
<body>
  <h1>MACROBAY dashboard live-update check</h1>
  <pre id="results" role="status">Loading dashboard…</pre>
  <script>
    (function () {
      const now = new Date();
      const key = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
      localStorage.setItem("test_macrobay_targets", JSON.stringify({ calories: 2000, protein: 100, carbs: 250, fat: 65, fiber: 25 }));
      localStorage.setItem("test_macrobay_nutrition", JSON.stringify({ [key]: { calories: 800, protein: 40, carbs: 100, fat: 30, fiber: 8, water: 0.5, foods: [] } }));
      localStorage.setItem("test_macrobay_planner", JSON.stringify({ [key]: { date: key, steps: 4000, workouts: [{ name: "Push Day", completed: false, exercises: [] }], tasks: [] } }));
      localStorage.setItem("test_macrobay_profile", JSON.stringify({ name: "Mina" }));

      const frame = document.createElement("iframe");
      frame.title = "MACROBAY live dashboard";
      frame.src = "../index.html";
      frame.addEventListener("load", function () {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const checks = [];
        function check(name, condition) { checks.push({ name: name, pass: !!condition }); }
        const text = function (id) { return doc.getElementById(id).textContent.trim(); };

        check("saved profile name appears in the Home greeting", text("home-user-name") === "Mina");
        const hour = new win.Date().getHours();
        const period = hour >= 5 && hour < 12 ? "morning" : hour < 17 && hour >= 12 ? "afternoon" : hour < 21 && hour >= 17 ? "evening" : "night";
        check("inline greeting icon follows local time", doc.getElementById("home-greeting-icon").dataset.period === period);
        const firstMotivation = text("home-motivation");
        doc.getElementById("home-greeting").click();
        check("tapping the greeting rotates its tagline", text("home-motivation") !== firstMotivation);
        check("daily thought card and inert notification control are removed", !doc.querySelector(".home-quote-card,.home-notifications,.home-notification-badge") && !doc.body.textContent.includes("A thought for today"));
        check("initial calories and protein render", text("terminal-calories") === "800" && text("terminal-protein") === "40");
        check("initial water, steps, and workout status render", text("terminal-water") === "0.50" && text("terminal-steps") === "4,000" && text("terminal-workout") === "0 / 1 complete");

        win.saveNutritionFor(key, { calories: 1600, protein: 95, carbs: 200, fat: 52, fiber: 20, water: 2.25, foods: [] });
        win.savePlannerFor(key, { date: key, steps: 8250, workouts: [{ name: "Push Day", completed: true, exercises: [] }], tasks: [] });

        check("nutrition changes update Home without a reload", text("terminal-calories") === "1,600" && text("terminal-protein") === "95" && text("terminal-water") === "2.25");
        check("planner changes update steps and workout completion without a reload", text("terminal-steps") === "8,250" && text("terminal-workout") === "1 / 1 complete");
        check("progress ring accessibility values update", doc.querySelector('[aria-label="Calories"]').getAttribute("aria-valuenow") === "80");

        const failed = checks.filter(function (item) { return !item.pass; }).length;
        document.getElementById("results").textContent = checks.map(function (item) { return (item.pass ? "PASS " : "FAIL ") + item.name; }).join("\n") + "\n\n" + (failed ? failed + " checks failed" : "All live-update checks passed");
        document.body.dataset.result = failed ? "fail" : "pass";
        document.title = failed ? "FAIL dashboard live update" : "PASS dashboard live update";
      }, { once: true });
      document.body.appendChild(frame);
    }());
  </script>
</body>
</html>
