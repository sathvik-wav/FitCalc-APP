<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MACROBAY Nutrition entry flow</title>
  <style>
    body { margin: 0; padding: 24px; color: #f2f5ff; background: #101624; font: 14px/1.5 system-ui,sans-serif; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    #results { padding: 16px; white-space: pre-wrap; border: 1px solid #34415e; border-radius: 12px; background: #182238; }
    iframe { position: fixed; top: 0; left: -2000px; width: 390px; height: 844px; border: 0; }
  </style>
  <script>window.MACROBAY_TEST_MODE = true;</script>
</head>
<body>
  <h1>MACROBAY Nutrition entry flow</h1>
  <pre id="results" role="status">Loading Nutrition…</pre>
  <script>
    (function () {
      "use strict";
      var output = document.getElementById("results");
      var frame = document.createElement("iframe");
      var checks = [];
      var loads = 0;
      function check(label, passed) { checks.push((passed ? "PASS " : "FAIL ") + label); }
      function done() {
        var failures = checks.filter(function (line) { return line.indexOf("FAIL ") === 0; }).length;
        output.textContent = checks.join("\n") + "\n\n" + (failures ? failures + " checks failed" : "All Nutrition entry checks passed");
        document.body.dataset.result = failures ? "fail" : "pass";
        document.title = failures ? "FAIL Nutrition entry" : "PASS Nutrition entry";
      }
      frame.addEventListener("load", function () {
        var win = frame.contentWindow;
        var doc = frame.contentDocument;
        loads += 1;
        if (loads === 1) win.addEventListener("error", function (event) {
          checks.push("FAIL iframe exception: " + event.message + "\n" + (event.error && event.error.stack || ""));
        });
        try {
          if (loads === 1) {
            var searchInput = doc.getElementById("food-name");
            var searchResults = doc.getElementById("food-api-results");
            var didRevealResults = false;
            searchResults.scrollIntoView = function () { didRevealResults = true; };
            searchInput.value = "oats";
            searchInput.dispatchEvent(new win.Event("input", { bubbles: true }));
            var offlineResult = doc.querySelector("#food-api-results .integration-result");
            check("Local results render immediately under search and scroll into view", !!offlineResult && searchResults.previousElementSibling.classList.contains("food-search-controls") && didRevealResults);
            check("Results are grouped with a single Use action and a macro summary", !!offlineResult && doc.querySelector("#food-api-results .food-results-group-basic h3").textContent === "Basic foods" && offlineResult.querySelectorAll("button").length === 1 && offlineResult.querySelector("button").textContent === "Use" && offlineResult.querySelector(".food-search-result-macros").textContent.includes("389 kcal") && !offlineResult.querySelector(".food-source-tag"));
            var secondFoodRow = win.createFoodSearchResultRow({ name: "Oats second", calories: 389, protein: 16.9, carbs: 66, fat: 6.9 });
            var foodResultList = offlineResult && offlineResult.parentElement;
            if (foodResultList) foodResultList.appendChild(secondFoodRow);
            check("Food search rows are flat with a divider", !!offlineResult && win.getComputedStyle(offlineResult).borderBottomWidth === "1px" && win.getComputedStyle(offlineResult).borderTopWidth === "0px" && win.getComputedStyle(offlineResult).borderRadius === "0px" && win.getComputedStyle(offlineResult).backgroundColor === "rgba(0, 0, 0, 0)");
            if (secondFoodRow.parentElement) secondFoodRow.remove();
            check("Separate database search controls are removed", !doc.getElementById("food-database-search") && !doc.getElementById("search-food-database"));

            check("Recent shortcuts are removed", !Array.from(doc.querySelectorAll(".food-shortcut-group strong")).some(function (item) { return item.textContent === "Recent"; }));
            win.toggleFoodFavorite(win.findFood("banana"));
            win.renderFoodShortcuts();
            check("Favorites remain available", Array.from(doc.querySelectorAll(".food-shortcut-group strong")).some(function (item) { return item.textContent === "Favorites"; }));

            var foodName = doc.getElementById("food-name");
            var amount = doc.getElementById("food-amount");
            var unit = doc.getElementById("food-amount-unit");
            foodName.value = "egg";
            foodName.dispatchEvent(new win.Event("input", { bubbles: true }));
            amount.value = "1";
            unit.value = "piece";
            amount.dispatchEvent(new win.Event("input", { bubbles: true }));
            check("One egg previews the actual 50 g weight", doc.getElementById("food-nutrition-preview").textContent.includes("1 piece · 50 g used"));

            foodName.value = "milk";
            foodName.dispatchEvent(new win.Event("input", { bubbles: true }));
            check("Milk has no piece unit", !Array.from(unit.options).some(function (option) { return option.value === "piece"; }));
            check("Milk exposes weight and volume units", ["g", "oz", "ml", "tsp", "tbsp", "cup", "glass"].every(function (value) {
              return Array.from(unit.options).some(function (option) { return option.value === value; });
            }));
            unit.value = "glass";
            unit.dispatchEvent(new win.Event("change", { bubbles: true }));
            check("Unit changes preserve the Amount label and update the input step", doc.getElementById("food-amount-label").textContent === "Amount" && amount.step === "0.25");
            foodName.value = "egg";
            foodName.dispatchEvent(new win.Event("input", { bubbles: true }));
            amount.value = "1";
            unit.value = "piece";
            doc.getElementById("food-meal").value = "Breakfast";
            doc.getElementById("add-food").click();

            var row = doc.querySelector("#food-list .nutrition-food-entry");
            check("Food row shows amount, meal, macros, and separated actions", !!row && row.querySelector(".food-entry-meta").textContent.includes("1 piece · 50 g") && row.querySelector(".food-entry-meal").textContent === "Breakfast" && !!row.querySelector(".food-entry-macros") && !!row.querySelector(".favorite-food") && !!row.querySelector(".edit-food") && row.querySelector(".remove-food").classList.contains("ghost-btn"));

            Object.defineProperty(win, "BarcodeDetector", { configurable: true, value: undefined });
            win.updateBarcodeCameraAvailability();
            check("Unsupported camera scanner stays hidden and barcode controls remain collapsed", doc.getElementById("start-barcode-camera").hidden && !doc.getElementById("barcode-camera-hint").hidden && /Camera scanning is not supported/.test(doc.getElementById("barcode-camera-hint").textContent) && !doc.getElementById("food-barcode-disclosure").open);
            check("Custom food disclosure has a visible plus indicator", win.getComputedStyle(doc.querySelector(".custom-food-details summary"), "::before").content.replace(/[\"']/g, "") === "+");
            check("Custom food form includes optional portion weights", ["custom-food-piece-grams", "custom-food-tbsp-grams", "custom-food-cup-grams", "custom-food-katori-grams"].every(function (id) { return !!doc.getElementById(id); }));
            check("Remaining targets are a five-column strip before food entry and food log before water", (function () {
              var remaining = doc.querySelector(".nutrition-remaining-card");
              var entry = doc.querySelector(".nutrition-food-entry-card");
              var log = doc.querySelector(".nutrition-food-log-card");
              var water = doc.querySelector(".nutrition-water-card");
              return !!remaining && !!entry && !!log && !!water && remaining.compareDocumentPosition(entry) & win.Node.DOCUMENT_POSITION_FOLLOWING && entry.compareDocumentPosition(log) & win.Node.DOCUMENT_POSITION_FOLLOWING && log.compareDocumentPosition(water) & win.Node.DOCUMENT_POSITION_FOLLOWING && remaining.querySelectorAll(".nutrition-remaining p").length === 5;
            }()));
            check("Water quick actions are connected and preserve the remaining strip", (function () {
              var water = doc.querySelector(".nutrition-water-card");
              var total = doc.getElementById("planner-water");
              var before = Number(total.textContent);
              doc.getElementById("add-water").click();
              var updated250 = Math.abs(Number(total.textContent) - before - 0.25) < 0.001;
              var before500 = Number(total.textContent);
              doc.getElementById("add-water-500").click();
              var updated500 = Math.abs(Number(total.textContent) - before500 - 0.5) < 0.001;
              return updated250 && updated500 && !!water.querySelector("#add-water-500") && !!doc.getElementById("remaining-calories");
            }()));

            frame.contentWindow.location.reload();
            return;
          }
          var saved = JSON.parse(win.localStorage.getItem("test_macrobay_nutrition") || "{}");
          var today = win.getDateKey(new win.Date());
          var foods = saved[today] && saved[today].foods || [];
          var reloadedRow = doc.querySelector("#food-list .nutrition-food-entry");
          check("Food entry and favorite persist after reload", foods.length === 1 && foods[0].amount === 50 && win.isFoodFavorite(win.findFood("banana")));
          check("Reloaded row keeps the exact amount", !!reloadedRow && reloadedRow.querySelector(".food-entry-meta").textContent.includes("1 piece · 50 g"));
          reloadedRow.querySelector(".remove-food").click();
          check("Subtle Remove deletes the row", doc.querySelectorAll("#food-list .nutrition-food-entry").length === 0);
          done();
        } catch (error) {
          check("Nutrition flow completes without error: " + error.message, false);
          done();
        }
      });
      frame.src = "../nutrition/index.html";
      document.body.appendChild(frame);
    }());
  </script>
</body>
</html>
